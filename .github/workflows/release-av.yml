name: Build and Release draw.io AV

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
  repository_dispatch:
    types:
      - plugins-updated
  workflow_dispatch:
  workflow_call:
    inputs:
      desktop_ref:
        description: 'Git ref or commit SHA of drawio-AV-desktop to build'
        type: string
        required: false
        default: ''
      trigger_reason:
        description: 'Custom release note description for workflow_call triggers'
        type: string
        required: false
        default: ''

concurrency:
  group: release-av
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drawio_version: ${{ steps.version.outputs.drawio_version }}
      av_version: ${{ steps.version.outputs.av_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout drawio-AV-desktop (with drawio submodule)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.desktop_ref || github.sha }}
          submodules: true
          persist-credentials: false
          path: desktop

      - name: Compute monotonic AV semver version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAWIO_VER=$(tr -d '[:space:]' < desktop/drawio/VERSION)
          if [[ ! "$DRAWIO_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid drawio/VERSION: $DRAWIO_VER"
            exit 1
          fi

          EXISTING_TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q '.[].tag_name' 2>/dev/null || true)
          MAX_AV=0
          while IFS= read -r t; do
            if [[ "$t" =~ -av\.([0-9]+) ]]; then
              num="${BASH_REMATCH[1]}"
              if (( 10#$num > MAX_AV )); then
                MAX_AV=$((10#$num))
              fi
            fi
          done <<< "$EXISTING_TAGS"

          BUILD_NUM="$GITHUB_RUN_NUMBER"
          if (( MAX_AV + 1 > BUILD_NUM )); then
            BUILD_NUM=$((MAX_AV + 1))
          fi

          while gh release view "v${DRAWIO_VER}-av.${BUILD_NUM}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                git -C desktop ls-remote --exit-code --tags origin "refs/tags/v${DRAWIO_VER}-av.${BUILD_NUM}" >/dev/null 2>&1; do
            BUILD_NUM=$((BUILD_NUM + 1))
          done

          AV_VER="${DRAWIO_VER}-av.${BUILD_NUM}"
          TAG="v${AV_VER}"

          echo "Computed AV version: $AV_VER (tag: $TAG)"
          {
            echo "drawio_version=$DRAWIO_VER"
            echo "av_version=$AV_VER"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder_args: --win nsis zip --x64
            artifact_paths: |
              desktop/dist/drawio-AV-*.exe
              desktop/dist/drawio-AV-*.exe.blockmap
              desktop/dist/drawio-AV-*.zip
              desktop/dist/latest.yml
          - os: macos-latest
            platform: macos
            builder_args: --mac dmg zip --x64 --arm64
            artifact_paths: |
              desktop/dist/drawio-AV-*.dmg
              desktop/dist/drawio-AV-*.dmg.blockmap
              desktop/dist/drawio-AV-*.zip
              desktop/dist/drawio-AV-*.zip.blockmap
              desktop/dist/latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux AppImage deb --x64
            artifact_paths: |
              desktop/dist/drawio-AV-*.AppImage
              desktop/dist/drawio-AV-*.deb
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout drawio-AV-desktop (with drawio submodule)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.desktop_ref || github.sha }}
          submodules: true
          persist-credentials: false
          path: desktop

      - name: Checkout drawio-av-plugins
        uses: actions/checkout@v6
        with:
          repository: jacinlowe/drawio-av-plugins
          ref: main
          persist-credentials: false
          path: drawio-av-plugins

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils

      - name: Install dependencies and sync plugins (${{ matrix.platform }})
        working-directory: desktop
        env:
          AV_VERSION: ${{ needs.prepare.outputs.av_version }}
        run: |
          npm ci
          npm run sync
          npm run sync-plugins

      - name: Run unit tests
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npm test

      - name: Package application (${{ matrix.platform }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder-av.json ${{ matrix.builder_args }} --publish never

      - name: Upload ${{ matrix.platform }} packages
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          path: ${{ matrix.artifact_paths }}

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout drawio-AV-desktop
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.desktop_ref || github.sha }}
          submodules: true
          path: desktop

      - name: Checkout drawio-av-plugins
        uses: actions/checkout@v6
        with:
          repository: jacinlowe/drawio-av-plugins
          ref: main
          persist-credentials: false
          path: drawio-av-plugins

      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REASON: ${{ inputs.trigger_reason }}
          DRAWIO_VER: ${{ needs.prepare.outputs.drawio_version }}
          AV_VER: ${{ needs.prepare.outputs.av_version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "release-assets/$manifest" ]; then
              echo "::error::Missing electron-updater manifest: $manifest"
              exit 1
            fi
          done

          DESKTOP_FULL_SHA=$(git -C desktop rev-parse HEAD)
          DESKTOP_SHA=$(git -C desktop rev-parse --short HEAD)
          PLUGINS_SHA=$(git -C drawio-av-plugins rev-parse --short HEAD)
          PLUGINS_FULL_SHA=$(git -C drawio-av-plugins rev-parse HEAD)
          PLUGINS_MSG=$(git -C drawio-av-plugins log -1 --pretty=%s)
          if [ -f drawio-av-plugins/package.json ] && jq -e '.avPlugins | length > 0' drawio-av-plugins/package.json >/dev/null 2>&1; then
            PLUGIN_LIST=$(jq -r '.avPlugins[]' drawio-av-plugins/package.json | sed 's/^/- `/;s/$/`/')
          else
            PLUGIN_LIST=$(ls -1 drawio-av-plugins/*.js | grep -v '\.config\.js$' | xargs -n1 basename | sed 's/^/- `/;s/$/`/')
          fi

          (
            cd release-assets
            sha256sum * > Files-SHA256-Hashes.txt
          )

          if [ -n "$TRIGGER_REASON" ]; then
            TRIGGER_DESC="$TRIGGER_REASON"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TRIGGER_DESC="Triggered automatically by plugin update in \`jacinlowe/drawio-av-plugins\`"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER_DESC="Triggered manually via workflow_dispatch"
          else
            TRIGGER_DESC="Triggered by push to \`$GITHUB_REPOSITORY\` (\`$GITHUB_REF_NAME\`)"
          fi

          cat <<EOF > release-notes.md
          ## draw.io AV Desktop — \`$TAG\`

          $TRIGGER_DESC

          ### Versions & Commits
          - **AV build version:** \`$AV_VER\` (core draw.io \`$DRAWIO_VER\`)
          - **Desktop repo:** [\`$DESKTOP_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$DESKTOP_FULL_SHA)
          - **AV Plugins repo:** [\`$PLUGINS_SHA\`](https://github.com/jacinlowe/drawio-av-plugins/commit/$PLUGINS_FULL_SHA) — $PLUGINS_MSG

          ### Bundled AV Plugins
          $PLUGIN_LIST

          ### In-App Updates
          - **Windows (NSIS `.exe`) & Linux (`.AppImage`):** Updates download automatically in the background and install on restart/quit.
          - **macOS & `.zip`/`.deb` installs:** Notifies in-app when a new AV release is available with a direct link to this release page.

          > **Note on unsigned builds:** Because these packages are not signed with commercial Apple/Microsoft certificates:
          > - **Windows:** Click *More info* → *Run anyway* if SmartScreen prompts on first launch.
          > - **macOS:** After dragging \`draw.io.app\` to Applications, run \`xattr -cr /Applications/draw.io.app\` (or right-click → *Open* / allow in *System Settings → Privacy & Security*).
          EOF

          sed -i 's/^          //' release-notes.md

          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DESKTOP_FULL_SHA" \
            --title "draw.io AV $TAG" \
            --notes-file release-notes.md \
            --latest
